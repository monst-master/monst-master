 function experience(){body.innerHTML=`<h3>経験値計算</h3><p class="muted">最新ノーマルクエスト「要塞シリーズ」の基本経験値60,000 EXPを固定で使用します。各種ボーナスを選択すると、1周あたりの獲得経験値と必要周回数を自動計算します。</p><div class="formgrid"><div class="field"><label>現在のランク</label><input id="eNow" type="number" min="1" max="3000" value="${Math.max(1,Number(a.rank)||1)}"></div><div class="field"><label>目標ランク</label><input id="eTarget" type="number" min="1" max="3000" value="${Math.min(3000,Math.max(2,(Number(a.rank)||1)+100))}"></div><div class="field"><label>現在ランク内の獲得済み経験値（任意）</label><input id="eCurrent" type="number" min="0" value="0" placeholder="ランクアップ直後なら0"></div><div class="field"><label>基本経験値（固定）</label><input id="eBase" type="text" value="60,000 EXP（最新ノマクエ）" disabled></div><div class="field"><label>経験値キャンペーン</label><select id="eCampaign"><option value="1">通常（×1.00）</option><option value="2">経験値2倍イベント（×2.00）</option><option value="3">エラベルベル・経験値3倍（×3.00）</option></select></div><div class="field"><label>運極ボーナス</label><select id="eLuck"><option value="1">なし（×1.00）</option><option value="1.01">Lv.1（×1.01）</option><option value="1.02">Lv.2（×1.02）</option><option value="1.03">Lv.3（×1.03）</option><option value="1.04">Lv.4（×1.04）</option><option value="1.05" selected>Lv.5（×1.05）</option></select></div><div class="field"><label>経験値アップアビリティ</label><select id="eAbility"><option value="1">なし（×1.00）</option><option value="1.5">あり（×1.50）</option></select></div><div class="field"><label>わくわくの実（学びの力）</label><select id="eSeed"><option value="1">なし（×1.00）</option><option value="1.5">特級（+50%・×1.50）</option><option value="1.55">特級M（+55%・×1.55）</option><option value="1.6">特級L（+60%・×1.60）</option><option value="1.65">特級EL（+65%・×1.65）</option></select></div><div class="field"><label>モンスポット（学びのパワー）</label><select id="eSpot"><option value="1">なし（×1.00）</option><option value="1.5">学びのパワー（×1.50）</option><option value="1.75">学びのパワー+（×1.75）</option></select></div><div class="field"><label>モンパス</label><select id="ePass"><option value="1">未加入・適用なし（×1.00）</option><option value="1.05">加入・適用あり（×1.05）</option></select></div><div class="field"><label>マルチプレイ</label><select id="eMulti"><option value="1">ソロ（×1.00）</option><option value="1.05">マルチ（×1.05）</option></select></div></div><div class="toolbar" style="margin-top:14px"><button class="primary" id="calcExp">必要経験値を計算</button></div><div id="eResult" class="grid2"><div class="stat"><div class="k">必要経験値</div><div class="v">-</div></div><div class="stat"><div class="k">必要周回数</div><div class="v">-</div></div></div><p class="muted" style="font-size:11px">※キャンペーンは通常・経験値2倍イベント・エラベルベル（経験値3倍）から1つ選択します。エラベルベル3倍と2倍イベントは重複せず、倍率の高い3倍を適用します。その他の倍率は選択した効果を乗算して計算します。運極ボーナスはLv.1～5（各1%）、経験値アップアビリティは1.5倍、わくわくの実「学びの力」は特級1.5倍・M1.55倍・L1.6倍・EL1.65倍、学びのパワーは1.5倍／+は1.75倍、モンパスとマルチは各1.05倍として計算します。モンパス倍率はマルチ参加時に適用される条件を想定しています。最新ノーマルクエストの基本経験値60,000 EXPを基準にしています。</p>`;
 $('#calcExp').onclick=()=>{let campaign=Number($('#eCampaign').value)||1,now=Math.max(1,Math.min(3000,Math.floor(Number($('#eNow').value)||1))),target=Math.max(1,Math.min(3000,Math.floor(Number($('#eTarget').value)||1))),current=Math.max(0,Number($('#eCurrent').value)||0),luck=Number($('#eLuck').value)||1,ability=Number($('#eAbility').value)||1,seed=Number($('#eSeed').value)||1,spot=Number($('#eSpot').value)||1,pass=Number($('#ePass').value)||1,multi=Number($('#eMulti').value)||1;if(target<now){$('#eResult').innerHTML='<div class="empty">目標ランクは現在ランク以上を指定してください。</div>';return}if(pass>1&&multi===1){$('#eResult').innerHTML='<div class="empty">モンパスの経験値倍率はマルチプレイ時に適用されます。マルチを選択してください。</div>';return}let need=Math.max(0,cumulative(target)-cumulative(now)-current),mult=campaign*luck*ability*seed*spot*pass*multi,per=Math.floor(60000*mult),runs=per?Math.ceil(need/per):0;$('#eResult').innerHTML=`<div class="stat"><div class="k">必要経験値（概算）</div><div class="v">${need.toLocaleString()}<em> EXP</em></div></div><div class="stat"><div class="k">1周あたりの獲得経験値</div><div class="v">${per.toLocaleString()}<em> EXP</em></div><div class="muted" style="font-size:12px;margin-top:7px">必要周回数：<b>${runs.toLocaleString()}回</b></div></div><div class="stat" style="grid-column:1/-1"><div class="k">選択中の倍率内訳</div><div class="v" style="font-size:17px">合計 ×${mult.toFixed(5).replace(/0+$/,'').replace(/\.$/,'')}</div><div class="muted" style="font-size:12px;margin-top:7px">キャンペーン ×${campaign.toFixed(2)} ／ 運極ボーナス ×${luck.toFixed(2)} ／ 経験値アビリティ ×${ability.toFixed(2)} ／ 学びの力 ×${seed.toFixed(2)} ／ スポット ×${spot.toFixed(2)} ／ モンパス ×${pass.toFixed(2)} ／ マルチ ×${multi.toFixed(2)}</div></div>`;};
 }
 function show(){tabs();if(active==='atk')attack();else if(active==='dmg')damage();else experience();}
 document.querySelectorAll('[data-calc-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.calcTab;show()});show();
}

function settings(v,a){v.innerHTML=head('データ管理','アカウントのバックアップ・復元と初期化')+`<section class="panel"><h3>現在のアカウント</h3><p>アカウント名：<b>${esc(a.name)}</b></p><p>登録キャラ：${a.characters.length}体 ／ クエスト編成：${a.quests.length}件 ／ EXカウンター：${(a.exTargets||[]).length}種</p><div class="toolbar"><button class="primary" id="backupOne">このアカウントを保存</button><button class="danger" id="deleteAccount">このアカウントを削除</button></div></section><section class="panel"><h3>バックアップについて</h3><p class="muted">全アカウントのデータをJSONファイルとして書き出せます。別のPC・ブラウザへ移す場合や、ブラウザのデータを消す前に必ず保存してください。</p><button class="primary" id="backupAll">全アカウントをバックアップ</button><button id="restoreAll">JSONから復元</button></section><section class="panel"><h3>データ保存の仕様</h3><ul class="muted"><li>このアプリ専用の保存領域を使用します。</li><li>アカウントごとにキャラ・厳選・編成・EX記録を分離します。</li><li>ブラウザの履歴・サイトデータ削除でデータが消える場合があります。</li><li>モンスト公式アカウントとは連携せず、手動で記録する管理ツールです。</li></ul></section>`;$('#backupOne').onclick=()=>download({version:1,accounts:[a],gachaDex:state.gachaDex,active:a.id},`monst-master-${a.name}.json`);$('#backupAll').onclick=exportData;$('#restoreAll').onclick=()=>$('#importFile').click();$('#deleteAccount').onclick=()=>{if(state.accounts.length===1){toast('最後の1アカウントは削除できません');return}if(confirm(`${a.name} を削除します。この操作は取り消せません。先にバックアップしてください。`)){state.accounts=state.accounts.filter(x=>x.id!==a.id);state.active=state.accounts[0].id;save();toast('アカウントを削除しました')}}}
function showModal(title,body,ok,callback){$('#modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h3>${title}</h3><button id="closeModal">✕</button></div>${body}<div class="toolbar" style="justify-content:flex-end;margin:16px 0 0"><button id="cancelModal">キャンセル</button><button class="primary" id="okModal">${ok}</button></div></div></div>`;$('#closeModal').onclick=$('#cancelModal').onclick=()=>$('#modalRoot').innerHTML='';$('#okModal').onclick=()=>{if(callback()!==false)$('#modalRoot').innerHTML=''}}
function download(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();URL.revokeObjectURL(url);toast('バックアップを作成しました')}
function exportData(){download({...state,version:1,exportedAt:new Date().toISOString()},'monst-master-backup.json')}
function importData(e){let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.accounts)||!d.accounts.length)throw Error('形式が違います');if(!confirm('現在の全データを読み込んだデータで置き換えます。事前にバックアップしましたか？'))return;state={accounts:d.accounts.map(a=>({...blank(a.name),...a,characters:a.characters||[],quests:a.quests||[],exRuns:a.exRuns||[],exTargets:a.exTargets||[]})),gachaDex:Array.isArray(d.gachaDex)?d.gachaDex:state.gachaDex,active:d.active&&d.accounts.some(a=>a.id===d.active)?d.active:d.accounts[0].id};save();toast('データを復元しました')}catch(err){alert('読み込めませんでした。MONST MASTERのJSONバックアップを選択してください。')}};reader.readAsText(file);e.target.value=''}
init();
})();
</script></body></html>
